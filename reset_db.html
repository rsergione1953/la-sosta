<!DOCTYPE html>
<html lang="it">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Reset Database - Area Sosta</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f7f4e9;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: white;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 10px rgba(0, 0, 0, 0.15);
            text-align: center;
            max-width: 400px;
        }

        h2 {
            color: #991b1b;
            margin-top: 0;
        }

        p {
            color: #334155;
            font-size: 0.95rem;
        }

        button {
            background-color: #dc2626;
            color: white;
            border: none;
            padding: 12px 20px;
            font-size: 1rem;
            font-weight: bold;
            border-radius: 5px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background-color: #b91c1c;
        }

        .btn-back {
            display: inline-block;
            margin-top: 15px;
            color: #475569;
            text-decoration: none;
            font-size: 0.85rem;
        }
    </style>
</head>

<body>

    <div class="card">
        <h2>⚠️ Reset Database</h2>
        <p>Questa operazione cancellerà **tutti gli stalli, le prenotazioni e lo storico** salvati nel browser.</p>

        <button onclick="confermaReset()">CANCELLA TUTTO E RIPARTI</button>
        <br>
        <a href="index.html" class="btn-back">← Torna all'App senza resettare</a>
    </div>

    <script>
        function confermaReset() {
            if (confirm("Sei SICURO di voler cancellare tutti i dati del database? Non si potrà tornare indietro.")) {

                // Cancella il database IndexedDB
                const req = indexedDB.deleteDatabase("AreaSostaDB");

                req.onsuccess = function () {
                    alert("Database azzerato con successo! Ora puoi ripartire da zero.");
                    window.location.href = "index.html";
                };

                req.onerror = function () {
                    alert("Errore durante l'eliminazione del Database.");
                };

                req.onblocked = function () {
                    alert("Chiudi tutte le altre schede aperte dell'app prima di procedere con il reset.");
                };
            }
        }
    </script>

</body>

</html>
